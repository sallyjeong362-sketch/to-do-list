name: Probe sync backends
on:
  push:
    branches: [claude/category-todo-app-rc9si3]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe textdb limits
        run: |
          set +e
          t() { # write $1 bytes of base64-ish payload under key $2, then report readback size
            python3 -c "import sys; sys.stdout.write('A0b1'*($1//4))" > payload.txt
            R=$(curl -sS -m 30 -X POST https://textdb.online/update --data-urlencode "key=$2" --data-urlencode value@payload.txt)
            B=$(curl -sS -m 30 "https://textdb.online/$2" | wc -c)
            echo "size=$1 resp=$R readback=$B"
          }
          echo "=== size limit search ==="
          t 20000 pcl_s20
          t 50000 pcl_s50
          t 80000 pcl_s80
          t 120000 pcl_s120
          t 160000 pcl_s160
          echo "=== uuid-with-hyphens key ==="
          curl -sS -m 20 -X POST https://textdb.online/update --data-urlencode 'key=019f7dca-3ece-76a0-8453-8d8e5e4131fd-probe' --data-urlencode 'value=uuidkey_ok' ; echo
          curl -sS -m 20 'https://textdb.online/019f7dca-3ece-76a0-8453-8d8e5e4131fd-probe' ; echo
          echo "=== korean + json value ==="
          curl -sS -m 20 -X POST https://textdb.online/update --data-urlencode 'key=pcl_kr' --data-urlencode 'value={"제목":"수업 준비","done":true}' >/dev/null
          curl -sS -m 20 https://textdb.online/pcl_kr ; echo
          echo "PROBE3 DONE"
