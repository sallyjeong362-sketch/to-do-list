name: Probe sync backends
on:
  push:
    branches: [claude/category-todo-app-rc9si3]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe textdb and jsonblob renewal
        run: |
          set +e
          echo "=== A1. jsonblob create ==="
          RESP=$(curl -sS -i -m 20 -X POST https://jsonblob.com/api/jsonBlob -H 'Content-Type: application/json' -d '{"probe":2}')
          echo "$RESP" | grep -i -E 'HTTP|x-jsonblob-expires-at|location'
          ID=$(echo "$RESP" | grep -i '^location:' | sed 's#.*/##' | tr -d '\r')
          echo "ID=$ID"
          sleep 3
          echo "=== A2. jsonblob GET (does access renew expiry?) ==="
          curl -sS -i -m 20 https://jsonblob.com/api/jsonBlob/$ID | grep -i -E 'HTTP|x-jsonblob-expires-at'
          echo "=== B. textdb POST /update (no trailing slash) ==="
          curl -sS -i -m 20 -X POST https://textdb.online/update --data-urlencode 'key=probe_cl_A1' --data-urlencode 'value={"a":1}' | head -15
          echo
          echo "=== C. textdb read back ==="
          curl -sS -m 20 https://textdb.online/probe_cl_A1 ; echo
          echo "=== D. textdb big value (200KB) ==="
          python3 -c "print('{\"x\":\"' + 'a'*200000 + '\"}')" > big.json
          curl -sS -i -m 30 -X POST https://textdb.online/update --data-urlencode 'key=probe_cl_big' --data-urlencode value@big.json | head -6
          echo "readback bytes:"
          curl -sS -m 30 https://textdb.online/probe_cl_big | wc -c
          echo "=== E. textdb GET-style update ==="
          curl -sS -i -m 20 'https://textdb.online/update?key=probe_cl_A2&value=hello2' | head -6
          curl -sS -m 20 https://textdb.online/probe_cl_A2 ; echo
          echo "=== F. textdb overwrite ==="
          curl -sS -m 20 -X POST https://textdb.online/update --data-urlencode 'key=probe_cl_A1' --data-urlencode 'value={"a":2}' >/dev/null
          curl -sS -m 20 https://textdb.online/probe_cl_A1 ; echo
          echo "PROBE2 DONE"
