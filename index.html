<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 투두 트래커</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #3b3a36;
    --muted: #8b8880;
    --line: #e7e3da;
    --accent: #6b8e6f;
    --c1: #5b8dbf; /* 수업 */
    --c2: #6ba368; /* 운영 */
    --c3: #d99a4e; /* 수업자료 */
    --c4: #9b7cb8; /* 자기계발 */
    --c5: #4fa3a5; /* 일정표 */
    --c6: #bd7a8c; /* 기타 */
    --c7: #6f6fbf; /* 수업계획 */
    --sel-bg: #eef3ee;
    --carry-ink: #b5651d;
    --carry-bg: #faeede;
    --slot-bg: #e8f2f2;
    --hover-bg: #f4f7f4;
    --row-line: #f0ede6;
    --chip-ink: #ffffff;
    --sun: #c0564f;
    --slot-c1: #e7eef6;
    --slot-c2: #e9f1e8;
    --slot-c3: #f8efe2;
    --slot-c4: #f0eaf5;
    --slot-c6: #f6ecef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #22211d;
      --card: #2c2b26;
      --ink: #e8e5dc;
      --muted: #9a968b;
      --line: #3e3c34;
      --accent: #8fae92;
      --sel-bg: #333a33;
      --carry-ink: #e0a370;
      --carry-bg: #3d3227;
      --slot-bg: #2e3a3a;
      --hover-bg: #31352f;
      --row-line: #34322b;
      --chip-ink: #22211d;
      --sun: #d98079;
      --slot-c1: #29323d;
      --slot-c2: #2c352b;
      --slot-c3: #3c342a;
      --slot-c4: #342e3b;
      --slot-c6: #3a2f33;
      --c7: #9291d6;
    }
  }
  :root[data-theme="light"] {
    --bg: #f6f4ef; --card: #ffffff; --ink: #3b3a36; --muted: #8b8880;
    --line: #e7e3da; --accent: #6b8e6f; --sel-bg: #eef3ee;
    --carry-ink: #b5651d; --carry-bg: #faeede; --slot-bg: #e8f2f2;
    --hover-bg: #f4f7f4; --row-line: #f0ede6; --chip-ink: #ffffff; --sun: #c0564f;
    --slot-c1: #e7eef6; --slot-c2: #e9f1e8; --slot-c3: #f8efe2; --slot-c4: #f0eaf5;
    --c6: #bd7a8c; --slot-c6: #f6ecef; --c7: #6f6fbf;
  }
  :root[data-theme="dark"] {
    --bg: #22211d; --card: #2c2b26; --ink: #e8e5dc; --muted: #9a968b;
    --line: #3e3c34; --accent: #8fae92; --sel-bg: #333a33;
    --carry-ink: #e0a370; --carry-bg: #3d3227; --slot-bg: #2e3a3a;
    --hover-bg: #31352f; --row-line: #34322b; --chip-ink: #22211d; --sun: #d98079;
    --slot-c1: #29323d; --slot-c2: #2c352b; --slot-c3: #3c342a; --slot-c4: #342e3b;
    --c6: #bd7a8c; --slot-c6: #3a2f33; --c7: #9291d6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--ink);
    max-width: 720px; margin: 0 auto; padding: 12px 12px 80px;
  }
  h1 { font-size: 20px; }
  button { font-family: inherit; cursor: pointer; }
  input, select { color: var(--ink); color-scheme: light dark; }

  /* ── 헤더/보상 ─────────────────────────── */
  header.top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 4px;
  }
  .reward-chip {
    display: flex; gap: 8px; align-items: center;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 20px; padding: 6px 12px; font-size: 13px;
  }
  .reward-chip b { color: var(--accent); }
  .levelbar {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 14px; margin-bottom: 12px;
  }
  .levelbar .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .levelbar .track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .levelbar .fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }

  /* ── 캘린더 ───────────────────────────── */
  .calendar {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; margin-bottom: 14px;
  }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .cal-head b { font-size: 15px; }
  .cal-head button {
    border: 1px solid var(--line); background: none; border-radius: 8px;
    width: 30px; height: 30px; font-size: 14px; color: var(--ink);
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-dow { text-align: center; font-size: 11px; color: var(--muted); padding: 2px 0; }
  .cal-cell {
    border: 1px solid transparent; border-radius: 8px; background: none;
    min-height: 46px; padding: 3px 0 1px; font-size: 12px; color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .cal-cell:not(:disabled):hover { border-color: var(--line); }
  .cal-cell .d { line-height: 1.2; }
  .cal-cell .badge { font-size: 13px; line-height: 1; }
  .cal-cell .pct { font-size: 9px; color: var(--muted); }
  .cal-cell.today .d {
    background: var(--ink); color: var(--card); border-radius: 50%;
    width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center;
  }
  .cal-cell.selected { border-color: var(--accent); background: var(--sel-bg); }
  .cal-cell.sun .d { color: var(--sun); } .cal-cell.today.sun .d { color: var(--card); }

  /* ── 날짜 표시줄 ──────────────────────── */
  .datebar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; padding: 0 2px;
  }
  .datebar .label { font-size: 15px; font-weight: 700; }
  .datebar .sub { font-size: 12px; color: var(--muted); }
  .datebar button {
    border: 1px solid var(--line); background: var(--card);
    border-radius: 8px; padding: 5px 10px; font-size: 12px; color: var(--ink);
  }

  /* ── 탭 ──────────────────────────────── */
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; }
  .tabs button {
    flex: 1; white-space: nowrap; padding: 9px 8px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--muted);
  }
  .tabs button.active { color: #fff; border-color: transparent; }
  .tabs button[data-tab="inbox"].active { background: var(--accent); }
  .tabs button[data-tab="c1"].active { background: var(--c1); }
  .tabs button[data-tab="c2"].active { background: var(--c2); }
  .tabs button[data-tab="c3"].active { background: var(--c3); }
  .tabs button[data-tab="c4"].active { background: var(--c4); }
  .tabs button[data-tab="c6"].active { background: var(--c6); }
  .tabs button[data-tab="sch"].active { background: var(--c5); }
  .tabs button[data-tab="lec"].active { background: var(--c7); }

  /* ── 수업 계획 ─────────────────────────── */
  .lec-card {
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--c7);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
  }
  .lec-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .lec-time { font-weight: 700; font-size: 13px; color: var(--ink); }
  .lec-class {
    font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px;
    background: var(--c7); color: #fff;
  }
  .lec-subject { font-size: 12.5px; color: var(--muted); }
  .lec-head .icon-btn { margin-left: auto; }
  .lec-field { font-size: 13px; margin-bottom: 4px; }
  .lec-field b { color: var(--muted); font-weight: 600; margin-right: 4px; }
  .lec-prep { list-style: none; margin-top: 4px; }
  .lec-prep li { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 12.5px; }
  .lec-prep .t-title.done { text-decoration: line-through; color: var(--muted); }
  .lec-form {
    border: 1px dashed var(--c7); border-radius: 10px; background: var(--hover-bg);
    padding: 10px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .lec-form .row2 { display: flex; gap: 6px; }
  .lec-form .row2 > * { flex: 1; min-width: 0; }
  .lec-form input, .lec-form textarea, .lec-form select {
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 13px; font-family: inherit; background: var(--card); color: var(--ink); width: 100%;
  }
  .lec-form textarea { min-height: 54px; resize: vertical; }
  .lec-form label { font-size: 11.5px; color: var(--muted); display: block; margin-bottom: 3px; }
  .lec-form .btn-row { display: flex; gap: 8px; }
  .lec-form .btn-row button {
    flex: 1; padding: 9px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600;
    background: var(--c7); color: #fff;
  }
  .lec-form .btn-row button.cancel { background: none; border: 1px solid var(--line); color: var(--muted); font-weight: 400; }
  .thumb-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
  .thumb { width: 52px; height: 52px; object-fit: cover; border-radius: 7px; border: 1px solid var(--line); cursor: pointer; }
  .thumb-wrap { position: relative; display: inline-block; }
  .thumb-remove {
    position: absolute; top: -5px; right: -5px; width: 17px; height: 17px; border-radius: 50%;
    background: var(--sun); color: #fff; border: none; font-size: 10px; cursor: pointer; line-height: 1;
  }
  .file-chip {
    width: 52px; height: 52px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    padding: 3px; cursor: pointer; text-align: center;
  }
  .file-chip-icon { font-size: 17px; line-height: 1; }
  .file-chip-name { font-size: 7.5px; color: var(--muted); line-height: 1.1; word-break: break-all; overflow: hidden; max-height: 2em; }
  .lightbox-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 30;
    align-items: center; justify-content: center; padding: 2rem;
  }
  .lightbox-overlay.show { display: flex; }
  .lightbox-img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  /* ── 투두 목록 ────────────────────────── */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .add-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .add-row input[type=text] {
    flex: 1; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 14px; font-family: inherit; background: var(--bg);
  }
  .add-row button.add {
    padding: 9px 16px; border: none; border-radius: 10px; background: var(--ink);
    color: var(--card); font-size: 14px;
  }
  ul.todos { list-style: none; }
  ul.todos li {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 4px; border-bottom: 1px solid var(--line);
  }
  ul.todos li:last-child { border-bottom: none; }
  .chk {
    width: 22px; height: 22px; flex: none; border-radius: 7px;
    border: 2px solid var(--line); background: none; font-size: 13px; color: var(--chip-ink);
  }
  .chk.on { border-color: var(--accent); background: var(--accent); }
  .chk.half { border-color: var(--carry-ink); background: var(--carry-bg); color: var(--carry-ink); }
  .t-title { flex: 1; font-size: 14px; word-break: break-all; }
  .t-title.done { text-decoration: line-through; color: var(--muted); }
  .tag-carry {
    font-size: 10px; color: var(--carry-ink); background: var(--carry-bg);
    border-radius: 6px; padding: 2px 6px; flex: none;
  }
  .icon-btn {
    border: none; background: none; color: var(--muted); font-size: 14px;
    padding: 4px; flex: none;
  }
  .icon-btn:hover { color: var(--ink); }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 0; }
  .cat-progress { font-size: 12px; color: var(--muted); margin-bottom: 8px; }

  /* ── 오늘 할 일 쏟아내기 (분류 전) ─────── */
  ul.inbox-list { list-style: none; }
  ul.inbox-list li {
    display: flex; flex-direction: column; gap: 6px;
    padding: 10px 4px; border-bottom: 1px solid var(--line);
  }
  ul.inbox-list li:last-child { border-bottom: none; }
  .inbox-row1 { display: flex; align-items: center; gap: 8px; }
  .inbox-cats { display: flex; gap: 6px; flex-wrap: wrap; }
  .cat-pick {
    border: 1px solid var(--line); background: var(--card); border-radius: 8px;
    padding: 4px 9px; font-size: 12px; font-weight: 600;
  }
  .cat-pick:hover { background: var(--hover-bg); }

  /* ── 일정표 ───────────────────────────── */
  .sch-form {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 12px;
  }
  .sch-form input, .sch-form select {
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 13px; font-family: inherit; background: var(--bg);
  }
  .sch-form input { flex: 1 1 100%; }
  .sch-form select { flex: 1 1 auto; }
  .sch-form button { flex: 0 0 auto; }
  .sch-form button {
    padding: 8px 14px; border: none; border-radius: 10px;
    background: var(--c5); color: #fff; font-size: 13px;
  }
  .sch-progress { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .timeline { border-top: 1px solid var(--line); }
  .slot-row { display: flex; align-items: stretch; min-height: 26px; border-bottom: 1px solid var(--row-line); }
  .slot-row.hour-start { border-top: 1px solid var(--line); }
  .slot-time {
    width: 48px; flex: none; font-size: 10px; color: var(--muted);
    padding: 6px 4px 0 2px; text-align: right;
  }
  .slot-body { flex: 1; padding: 2px 0 2px 8px; display: flex; align-items: center; }
  .slot-body.clickable { cursor: pointer; }
  .slot-body.clickable:hover { background: var(--hover-bg); }
  .slot-block {
    flex: 1; display: flex; align-items: center; gap: 8px;
    border-radius: 8px; padding: 3px 8px; font-size: 13px;
    background: var(--slot-bg); border-left: 4px solid var(--c5);
  }
  .slot-block.done-block { opacity: .55; }
  .slot-block.cat-c1 { background: var(--slot-c1); border-left-color: var(--c1); }
  .slot-block.cat-c2 { background: var(--slot-c2); border-left-color: var(--c2); }
  .slot-block.cat-c3 { background: var(--slot-c3); border-left-color: var(--c3); }
  .slot-block.cat-c4 { background: var(--slot-c4); border-left-color: var(--c4); }
  .slot-block.cat-c6 { background: var(--slot-c6); border-left-color: var(--c6); }
  .balance { margin-bottom: 10px; }
  .balance-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); }
  .balance-bar span { height: 100%; }
  .balance-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .balance-legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; }
  .slot-block .name.done { text-decoration: line-through; }
  .slot-block .name { flex: 0 1 auto; max-width: 48%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot-block .note-input {
    flex: 1; min-width: 40px; border: none; background: transparent;
    font-size: 11px; color: var(--muted); font-family: inherit;
    border-bottom: 1px dashed transparent; padding: 2px 0 2px 4px;
  }
  .slot-block .note-input:focus { outline: none; border-bottom-color: var(--c5); color: var(--ink); }
  .slot-block .chk { width: 19px; height: 19px; font-size: 11px; border-radius: 6px; touch-action: none; }
  .fill-handle {
    flex: none; width: 20px; height: 20px; border-radius: 6px;
    border: 1px dashed var(--muted); color: var(--muted); font-size: 11px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: ns-resize; touch-action: none; background: var(--card); user-select: none;
  }
  .slot-body.fill-preview { background: var(--hover-bg); box-shadow: inset 4px 0 0 var(--c5); border-radius: 8px; }
  .slot-input {
    flex: 1; padding: 4px 8px; font-size: 13px; font-family: inherit;
    border: 1px solid var(--c5); border-radius: 8px; background: var(--bg); color: var(--ink);
  }
  .slot-editor {
    flex: 1; display: flex; flex-direction: column; gap: 5px;
    border: 1px dashed var(--c5); border-radius: 8px; background: var(--hover-bg);
    padding: 7px 8px; margin: 2px 0;
  }
  .slot-editor input, .slot-editor select {
    padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 13px; font-family: inherit; background: var(--card);
  }
  .slot-editor .se-row { display: flex; gap: 5px; }
  .slot-editor .se-row select { flex: 1; min-width: 0; }
  .slot-editor .se-row button {
    flex: none; padding: 6px 12px; border: none; border-radius: 8px;
    background: var(--c5); color: #fff; font-size: 13px;
  }
  .slot-editor .se-row button.se-cancel { background: none; border: 1px solid var(--line); color: var(--muted); }

  /* ── 오늘 요약 ────────────────────────── */
  .day-summary {
    margin-top: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; font-size: 13px;
    display: flex; align-items: center; gap: 10px;
  }
  .day-summary .big { font-size: 26px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: var(--card); font-size: 13px;
    padding: 10px 18px; border-radius: 20px; opacity: 0; transition: opacity .3s;
    pointer-events: none; z-index: 10; max-width: 90%;
  }
  .toast.show { opacity: .95; }

  /* ── 매일 루틴 ───────────────────────── */
  .r-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 12px;
  }
  .r-head { display: flex; align-items: center; gap: 8px; }
  .r-head b { font-size: 14px; }
  .r-head .r-prog { font-size: 12px; color: var(--muted); flex: 1; }
  .r-head button.r-toggle { border: none; background: none; font-size: 13px; color: var(--muted); padding: 2px 6px; }
  ul.r-list { list-style: none; margin-top: 8px; }
  ul.r-list li { display: flex; align-items: center; gap: 8px; padding: 7px 2px; border-bottom: 1px solid var(--row-line); }
  ul.r-list li:last-child { border-bottom: none; }
  ul.r-list .r-title { flex: 1; font-size: 14px; word-break: break-all; }
  ul.r-list .r-title.done { text-decoration: line-through; color: var(--muted); }
  .r-add { display: flex; gap: 6px; margin-top: 10px; }
  .r-add input {
    flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 13px; font-family: inherit; background: var(--bg);
  }
  .r-add button { padding: 8px 14px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-size: 13px; }
  .r-empty { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* ── 동기화 ───────────────────────────── */
  .sync-chip {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--card);
    font-size: 15px; color: var(--muted); position: relative;
  }
  .sync-chip.ok { color: var(--accent); border-color: var(--accent); }
  .sync-chip.syncing { color: var(--c1); }
  .sync-chip.error { color: var(--sun); border-color: var(--sun); }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    max-width: 420px; width: 100%; padding: 18px; font-size: 14px;
    max-height: 85vh; overflow-y: auto;
  }
  .modal h2 { font-size: 16px; margin-bottom: 10px; }
  .modal p.desc { color: var(--muted); font-size: 12px; line-height: 1.6; margin-bottom: 12px; }
  .modal .btn {
    display: block; width: 100%; padding: 10px; margin-top: 8px;
    border: none; border-radius: 10px; font-size: 14px; font-weight: 600;
    background: var(--accent); color: #fff;
  }
  .modal .btn.secondary { background: none; border: 1px solid var(--line); color: var(--ink); font-weight: 400; }
  .modal .btn.danger { background: none; border: 1px solid var(--sun); color: var(--sun); font-weight: 400; }
  .modal input.code-input {
    width: 100%; padding: 10px; margin-top: 8px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
    font-size: 13px; font-family: inherit;
  }
  .modal .code-box {
    background: var(--bg); border: 1px dashed var(--line); border-radius: 10px;
    padding: 10px; font-size: 12px; word-break: break-all; margin: 8px 0;
    font-family: ui-monospace, monospace;
  }
  .modal .sync-meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .modal .close-row { text-align: right; margin-top: 12px; }
  .modal .close-row button { border: none; background: none; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header class="top">
  <h1>🗓 나의 투두 트래커</h1>
  <div style="display:flex;gap:6px;align-items:center">
    <button class="sync-chip" id="syncBtn" title="기기 간 동기화">☁</button>
    <div class="reward-chip">
      <span id="levelEmoji">🌱</span>
      <span><b id="points">0</b>P</span>
      <span>🔥 <b id="streak">0</b>일</span>
    </div>
  </div>
</header>

<div class="levelbar">
  <div class="row"><span id="levelName">새싹</span><span id="levelNext"></span></div>
  <div class="track"><div class="fill" id="levelFill" style="width:0%"></div></div>
</div>

<div class="calendar">
  <div class="cal-head">
    <button id="calPrev">◀</button>
    <b id="calTitle"></b>
    <button id="calNext">▶</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<div class="datebar">
  <div>
    <div class="label" id="dateLabel"></div>
    <div class="sub" id="dateSub"></div>
  </div>
  <button id="goToday">오늘로</button>
</div>

<div id="routineBox"></div>

<div class="tabs" id="tabs">
  <button data-tab="inbox">📝 오늘 할 일</button>
  <button data-tab="lec">📚 수업계획</button>
  <button data-tab="c1">1. 수업</button>
  <button data-tab="c2">2. 운영</button>
  <button data-tab="c3">3. 수업자료</button>
  <button data-tab="c4">4. 자기계발</button>
  <button data-tab="c6">5. 기타</button>
  <button data-tab="sch">6. 일정표</button>
</div>

<div class="panel" id="panel"></div>
<div class="lightbox-overlay" id="lightboxOverlay"></div>

<div class="day-summary">
  <span class="big" id="sumEmoji">🌱</span>
  <div>
    <div><b id="sumRate">0%</b> 달성</div>
    <div style="color:var(--muted)" id="sumMsg"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="syncModal">
  <div class="modal" id="syncModalBody"></div>
</div>

<script>
(function () {
  'use strict';

  var CATS = {
    c1: { name: '수업',     color: 'var(--c1)' },
    c2: { name: '운영',     color: 'var(--c2)' },
    c3: { name: '수업자료', color: 'var(--c3)' },
    c4: { name: '자기계발', color: 'var(--c4)' },
    c6: { name: '기타',     color: 'var(--c6)' }
  };
  var CAT_KEYS = ['c1', 'c2', 'c3', 'c4', 'c6'];
  var SLOT_START = 5 * 60;   // 05:00
  var SLOT_END = 24 * 60;    // 24:00
  var STEP = 15;
  var POINT_TODO = 10;       // 할 일 1개 완료
  var POINT_SLOT = 5;        // 15분 블록 1개 완료
  var POINT_ROUTINE = 5;     // 루틴 1개 실천
  var LEVELS = [
    { at: 0,    name: '새싹',   emoji: '🌱' },
    { at: 100,  name: '잎새',   emoji: '🌿' },
    { at: 300,  name: '가지',   emoji: '🪴' },
    { at: 600,  name: '나무',   emoji: '🌳' },
    { at: 1000, name: '큰나무', emoji: '🌲' },
    { at: 1500, name: '숲',     emoji: '🏞' },
    { at: 2500, name: '전설의 숲', emoji: '🌈' }
  ];

  var STORE_KEY = 'todoTracker.v1';
  var state = load();
  var todayKey = dateKey(new Date());
  var selectedDate = todayKey;
  var calCursor = new Date();       // 캘린더에 표시 중인 달
  var activeTab = 'inbox';
  var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };

  /* ── 저장/불러오기 ─────────────────────── */
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.days) {
          if (!s.routines) s.routines = [];
          migrateTodoStatus(s);
          return s;
        }
      }
    } catch (e) {}
    return { days: {}, meta: { points: 0 }, routines: [] };
  }
  // 기존 done(true/false) 데이터를 status(0=미착수/1=진행중/2=완료) 3단계로 변환
  function migrateTodoStatus(s) {
    Object.keys(s.days || {}).forEach(function (key) {
      (s.days[key].todos || []).forEach(function (t) {
        if (typeof t.status !== 'number') t.status = t.done ? 2 : 0;
      });
    });
  }
  function saveLocal() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  function save() {
    if (!state.meta) state.meta = { points: 0 };
    state.meta.updatedAt = Date.now();
    if (typeof lastActivityAt !== 'undefined') lastActivityAt = Date.now();
    saveLocal();
    schedulePush();
  }
  function day(key) {
    if (!state.days[key]) state.days[key] = { todos: [], slots: {} };
    if (!state.days[key].slots) state.days[key].slots = {};
    if (!state.days[key].todos) state.days[key].todos = [];
    if (!state.days[key].inbox) state.days[key].inbox = [];
    if (!state.days[key].rchecks) state.days[key].rchecks = {};
    if (!state.days[key].lecturePlans) state.days[key].lecturePlans = [];
    return state.days[key];
  }

  /* ── 날짜 유틸 ────────────────────────── */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseKey(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmtLabel(k) {
    var d = parseKey(k);
    var dow = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + dow + ')';
  }
  function minToHM(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }

  /* ── 통계 ─────────────────────────────── */
  function dayStats(key) {
    var d = state.days[key];
    var total = 0, done = 0;
    if (d) {
      (d.todos || []).forEach(function (t) { if (t.del) return; total++; if (t.done) done++; });
      Object.keys(d.slots || {}).forEach(function (m) { if (d.slots[m].del) return; total++; if (d.slots[m].done) done++; });
    }
    if (key <= todayKey) {
      var checks = (d && d.rchecks) || {};
      (state.routines || []).forEach(function (r) {
        if (r.del || (r.created || '9999-99-99') > key) return;
        total++;
        if (checks[r.id] && checks[r.id].done) done++;
      });
    }
    return { total: total, done: done, rate: total ? done / total : 0 };
  }
  function badgeFor(st) {
    if (!st.total) return '';
    if (st.rate >= 1)   return '🏆';
    if (st.rate >= 0.8) return '🌟';
    if (st.rate >= 0.5) return '🌤';
    if (st.rate > 0)    return '🌱';
    return '▫️';
  }
  function calcStreak() {
    var n = 0;
    var d = new Date();
    // 오늘은 아직 진행 중이므로, 오늘이 80% 이상이면 포함
    var todaySt = dayStats(dateKey(d));
    if (todaySt.total && todaySt.rate >= 0.8) n++;
    d.setDate(d.getDate() - 1);
    for (;;) {
      var st = dayStats(dateKey(d));
      if (st.total && st.rate >= 0.8) { n++; d.setDate(d.getDate() - 1); }
      else break;
    }
    return n;
  }
  function levelInfo(points) {
    var cur = LEVELS[0], next = null;
    for (var i = 0; i < LEVELS.length; i++) {
      if (points >= LEVELS[i].at) cur = LEVELS[i];
      else { next = LEVELS[i]; break; }
    }
    return { cur: cur, next: next };
  }
  function addPoints(n, msg) {
    state.meta.points = Math.max(0, (state.meta.points || 0) + n);
    if (n > 0 && msg) toast(msg + ' +' + n + 'P');
  }

  /* ── 이월 (전날 못 지킨 것 → 오늘 자동 추가) ── */
  function carryOver() {
    var moved = 0;
    Object.keys(state.days).forEach(function (key) {
      if (key >= todayKey) return;
      (state.days[key].todos || []).forEach(function (t) {
        if (!t.done && !t.carriedForward && !t.del) {
          t.carriedForward = true;
          t.ts = Date.now();
          day(todayKey).todos.push({
            // 진행중(▲)이었던 항목은 오늘도 진행중으로, 완료 표시될 때까지 계속 이어진다
            id: uid(), cat: t.cat, title: t.title, status: t.status || 0,
            done: false, carried: true, from: key, ts: Date.now()
          });
          moved++;
        }
      });
      (state.days[key].inbox || []).forEach(function (t) {
        if (!t.carriedForward && !t.del) {
          t.carriedForward = true;
          t.ts = Date.now();
          day(todayKey).inbox.push({
            id: uid(), title: t.title, carried: true, from: key, ts: Date.now()
          });
          moved++;
        }
      });
    });
    if (moved) {
      save();
      toast('어제까지 못 끝낸 할 일 ' + moved + '개를 오늘로 가져왔어요 📦');
    }
  }

  /* ── 토스트 ───────────────────────────── */
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  /* ── 렌더: 보상 헤더 ──────────────────── */
  function renderReward() {
    var pts = state.meta.points || 0;
    var li = levelInfo(pts);
    document.getElementById('points').textContent = pts;
    document.getElementById('streak').textContent = calcStreak();
    document.getElementById('levelEmoji').textContent = li.cur.emoji;
    document.getElementById('levelName').textContent = li.cur.emoji + ' ' + li.cur.name;
    var fill = document.getElementById('levelFill');
    var nextEl = document.getElementById('levelNext');
    if (li.next) {
      var span = li.next.at - li.cur.at;
      fill.style.width = Math.min(100, Math.round((pts - li.cur.at) / span * 100)) + '%';
      nextEl.textContent = '다음 ' + li.next.emoji + ' ' + li.next.name + '까지 ' + (li.next.at - pts) + 'P';
    } else {
      fill.style.width = '100%';
      nextEl.textContent = '최고 레벨 달성! 🎉';
    }
  }

  /* ── 렌더: 캘린더 ─────────────────────── */
  function renderCalendar() {
    var y = calCursor.getFullYear(), m = calCursor.getMonth();
    document.getElementById('calTitle').textContent = y + '년 ' + (m + 1) + '월';
    var grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    ['일', '월', '화', '수', '목', '금', '토'].forEach(function (d) {
      var el = document.createElement('div');
      el.className = 'cal-dow'; el.textContent = d;
      grid.appendChild(el);
    });
    var first = new Date(y, m, 1).getDay();
    var count = new Date(y, m + 1, 0).getDate();
    for (var i = 0; i < first; i++) grid.appendChild(document.createElement('div'));
    for (var dd = 1; dd <= count; dd++) {
      var key = y + '-' + pad(m + 1) + '-' + pad(dd);
      var st = dayStats(key);
      var cell = document.createElement('button');
      cell.className = 'cal-cell';
      if (key === todayKey) cell.className += ' today';
      if (key === selectedDate) cell.className += ' selected';
      if (new Date(y, m, dd).getDay() === 0) cell.className += ' sun';
      var html = '<span class="d">' + dd + '</span>';
      var b = badgeFor(st);
      if (b) html += '<span class="badge">' + b + '</span><span class="pct">' + Math.round(st.rate * 100) + '%</span>';
      cell.innerHTML = html;
      cell.dataset.key = key;
      cell.addEventListener('click', function () {
        selectedDate = this.dataset.key;
        renderAll();
      });
      grid.appendChild(cell);
    }
  }

  /* ── 렌더: 날짜줄 & 요약 ──────────────── */
  function renderDatebar() {
    document.getElementById('dateLabel').textContent = fmtLabel(selectedDate);
    document.getElementById('dateSub').textContent =
      selectedDate === todayKey ? '오늘' : (selectedDate < todayKey ? '지난 날짜' : '예정');
    var st = dayStats(selectedDate);
    document.getElementById('sumRate').textContent = Math.round(st.rate * 100) + '%';
    document.getElementById('sumEmoji').textContent = st.total ? (badgeFor(st) || '🌱') : '📝';
    var msg;
    if (!st.total) msg = '할 일을 추가해서 하루를 계획해 보세요.';
    else if (st.rate >= 1) msg = '완벽해요! 오늘의 트로피 획득 🏆';
    else if (st.rate >= 0.8) msg = '아주 잘하고 있어요, 조금만 더!';
    else if (st.rate >= 0.5) msg = '절반을 넘겼어요. 꾸준히 가봅시다.';
    else msg = st.done + '개 완료 / 총 ' + st.total + '개';
    document.getElementById('sumMsg').textContent = msg;
  }

  /* ── 매일 루틴 ───────────────────────── */
  function activeRoutines(dateKey) {
    return (state.routines || []).filter(function (r) {
      return !r.del && (r.created || '') <= dateKey;
    });
  }
  function renderRoutines() {
    var box = document.getElementById('routineBox');
    var rs = activeRoutines(selectedDate);
    var d = day(selectedDate);
    var checks = d.rchecks;
    var doneN = rs.filter(function (r) { return checks[r.id] && checks[r.id].done; }).length;
    var open = localStorage.getItem('todoTracker.ui.routineOpen') !== '0';

    var html = '<div class="r-card"><div class="r-head">' +
      '<b>🔁 매일 루틴</b>' +
      '<span class="r-prog">' + (rs.length ? doneN + ' / ' + rs.length + ' 실천' : '매일 반복할 일을 등록해 보세요') + '</span>' +
      '<button class="r-toggle" id="rToggle">' + (open ? '접기 ▴' : '펼치기 ▾') + '</button>' +
      '</div>';
    if (open) {
      html += '<ul class="r-list" id="rList"></ul>' +
        (rs.length ? '' : '<div class="r-empty">예: 아침 물 한 잔, 영단어 10개, 스트레칭 10분 — 루틴은 다음날로 이월되지 않고 날짜마다 새로 체크해요.</div>') +
        '<div class="r-add">' +
        '<input type="text" id="rNew" maxlength="60" placeholder="새 루틴 추가 (매일 반복)">' +
        '<button id="rAdd">추가</button></div>';
    }
    html += '</div>';
    box.innerHTML = html;

    document.getElementById('rToggle').addEventListener('click', function () {
      localStorage.setItem('todoTracker.ui.routineOpen', open ? '0' : '1');
      renderRoutines();
    });
    if (!open) return;

    var list = document.getElementById('rList');
    rs.forEach(function (r) {
      var chk = checks[r.id] && checks[r.id].done;
      var li = document.createElement('li');
      li.innerHTML =
        '<button class="chk' + (chk ? ' on' : '') + '">' + (chk ? '✓' : '') + '</button>' +
        '<span class="r-title' + (chk ? ' done' : '') + '"></span>' +
        '<button class="icon-btn edit" title="수정">✎</button>' +
        '<button class="icon-btn del" title="삭제">✕</button>';
      li.querySelector('.r-title').textContent = r.title;
      li.querySelector('.chk').addEventListener('click', function () {
        var now = !(checks[r.id] && checks[r.id].done);
        checks[r.id] = { done: now, ts: Date.now() };
        addPoints(now ? POINT_ROUTINE : -POINT_ROUTINE, now ? '루틴 실천!' : null);
        save(); renderAll();
      });
      li.querySelector('.edit').addEventListener('click', function () {
        var v = prompt('루틴 수정', r.title);
        if (v !== null && v.trim()) { r.title = v.trim(); r.ts = Date.now(); save(); renderAll(); }
      });
      li.querySelector('.del').addEventListener('click', function () {
        if (!confirm('루틴 「' + r.title + '」을(를) 삭제할까요?\n매일 목록에서 사라집니다.')) return;
        r.del = Date.now(); r.ts = Date.now();
        save(); renderAll();
      });
      list.appendChild(li);
    });

    function addRoutine() {
      var inp = document.getElementById('rNew');
      var v = inp.value.trim();
      if (!v) return;
      state.routines.push({ id: uid(), title: v, created: selectedDate, ts: Date.now() });
      save(); renderAll();
      var again = document.getElementById('rNew');
      if (again) again.focus();
    }
    document.getElementById('rAdd').addEventListener('click', addRoutine);
    document.getElementById('rNew').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') addRoutine();
    });
  }

  /* ── 할 일 3단계 체크 (미착수 → 진행중 → 완료) ── */
  function todoChkClass(t) { return t.status === 2 ? ' on' : (t.status === 1 ? ' half' : ''); }
  function todoChkGlyph(t) { return t.status === 2 ? '✓' : (t.status === 1 ? '▲' : ''); }
  // 클릭할 때마다 미착수(0) → 진행중(1) → 완료(2) → 미착수 순으로 돈다.
  // done은 status===2와 항상 같은 값으로 맞춰두는 하위 호환용 거울 필드로,
  // 일정표 연동(syncSlotsWithTodo)·통계·이월 로직이 그대로 이걸 참조한다.
  function advanceTodoStatus(t) {
    var was2 = t.status === 2;
    t.status = ((t.status || 0) + 1) % 3;
    t.done = t.status === 2;
    t.ts = Date.now();
    if (t.status === 2 && !was2) addPoints(POINT_TODO, null);
    else if (t.status !== 2 && was2) addPoints(-POINT_TODO, null);
    return { was2: was2, now2: t.status === 2 };
  }

  /* ── 할 일 ↔ 일정표 블록 연동 ─────────── */
  function syncSlotsWithTodo(t) {
    var slots = day(selectedDate).slots;
    var changed = 0;
    Object.keys(slots).forEach(function (k) {
      var sl = slots[k];
      if (!sl.del && sl.name === t.title && sl.done !== t.done) {
        sl.done = t.done;
        sl.ts = Date.now();
        addPoints(t.done ? POINT_SLOT : -POINT_SLOT);
        changed++;
      }
    });
    return changed;
  }

  /* ── 렌더: 오늘 할 일 쏟아내기 (분류 전) ── */
  function renderInboxPanel() {
    var panel = document.getElementById('panel');
    var d = day(selectedDate);
    var items = d.inbox.filter(function (t) { return !t.del; });

    var catBtns = CAT_KEYS.map(function (k) {
      return '<button class="cat-pick" data-cat="' + k + '" style="border-color:' + CATS[k].color +
        ';color:' + CATS[k].color + '">' + CATS[k].name + '</button>';
    }).join('');

    panel.innerHTML =
      '<div class="add-row">' +
      '  <input type="text" id="newInbox" placeholder="오늘 할 일을 생각나는 대로 적어보세요…" maxlength="80">' +
      '  <button class="add" id="addInbox">추가</button>' +
      '</div>' +
      (items.length ? '<div class="cat-progress">' + items.length + '개 · 버튼을 눌러 카테고리로 분류하세요</div>' : '') +
      '<ul class="inbox-list" id="inboxList"></ul>';

    var list = document.getElementById('inboxList');
    if (!items.length) {
      list.innerHTML = '<div class="empty">떠오르는 일을 뭐든 적어보세요. 나중에 카테고리별로 정리하면 됩니다.</div>';
    } else {
      items.forEach(function (t) {
        var li = document.createElement('li');
        var carryTag = t.carried
          ? '<span class="tag-carry">↪ ' + (t.from ? t.from.slice(5).replace('-', '/') : '이월') + '</span>' : '';
        li.innerHTML =
          '<div class="inbox-row1">' +
          '<span class="t-title"></span>' + carryTag +
          '<button class="icon-btn edit" title="수정">✎</button>' +
          '<button class="icon-btn del" title="삭제">✕</button>' +

  /* ── 렌더: 카테고리 탭 (1~4) ──────────── */
  function renderCatPanel(cat) {

  /* ── 일정표 드래그 다중 체크 ──────────── */
  var slotDrag = null;
  var slotDragEndAt = 0;
  function applyDragTo(min) {
    if (!slotDrag) return;
    var slots = day(selectedDate).slots;
    var sl = slots[min];
    if (!sl || sl.del || sl.done === slotDrag.target) return;
    sl.done = slotDrag.target;
    sl.ts = Date.now();
    slotDrag.changed.push(min);
    var row = document.querySelector('.slot-row[data-min="' + min + '"]');
    if (row) {
      var block = row.querySelector('.slot-block');
      var chk = row.querySelector('.chk');
      var nameEl = row.querySelector('.name');
      if (block) block.classList.toggle('done-block', sl.done);
      if (chk) { chk.classList.toggle('on', sl.done); chk.textContent = sl.done ? '✓' : ''; }
      if (nameEl) nameEl.classList.toggle('done', sl.done);
    }
  }
  function onSlotDragMove(e) {
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var row = el && el.closest ? el.closest('.slot-row[data-min]') : null;
    if (row) applyDragTo(+row.getAttribute('data-min'));
  }
  function endSlotDrag() {
    document.removeEventListener('pointermove', onSlotDragMove);
    document.removeEventListener('pointerup', endSlotDrag);
    document.removeEventListener('pointercancel', endSlotDrag);
    if (!slotDrag) return;
    var n = slotDrag.changed.length;
    var target = slotDrag.target;
    slotDrag = null;
    slotDragEndAt = Date.now();
    if (n) {
      addPoints(target ? n * POINT_SLOT : -n * POINT_SLOT, null);
      toast(target ? '15분 블록 ' + n + '개 완료! +' + (n * POINT_SLOT) + 'P'
                   : '15분 블록 ' + n + '개 체크 해제');
      save();
    }
    renderAll();
  }
  function startSlotDrag(min) {
    var sl = day(selectedDate).slots[min];
    if (!sl || sl.del || slotDrag) return;
    slotDrag = { target: !sl.done, changed: [] };
    applyDragTo(min);
    document.addEventListener('pointermove', onSlotDragMove);
    document.addEventListener('pointerup', endSlotDrag);
    document.addEventListener('pointercancel', endSlotDrag);
  }

  /* ── 일정표 채우기 드래그 (엑셀식 복제) ── */
  var fillDrag = null;
  function updateFillPreview(targetMin) {
    if (!fillDrag) return;
    var slots = day(selectedDate).slots;
    var src = fillDrag.sourceMin;
    var mins = [];
    if (targetMin !== src) {
      var dir = targetMin > src ? STEP : -STEP;
      for (var m = src + dir; (dir > 0 ? m <= targetMin : m >= targetMin); m += dir) {
        if (m < SLOT_START || m >= SLOT_END || (slots[m] && !slots[m].del)) break;
        mins.push(m);
      }
    }
    fillDrag.mins = mins;
    var prev = document.querySelectorAll('.slot-body.fill-preview');
    for (var i = 0; i < prev.length; i++) prev[i].classList.remove('fill-preview');
    mins.forEach(function (mm) {
      var body = document.querySelector('.slot-row[data-min="' + mm + '"] .slot-body');
      if (body) body.classList.add('fill-preview');
    });
  }
  function onFillMove(e) {
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var row = el && el.closest ? el.closest('.slot-row[data-min]') : null;
    if (row) updateFillPreview(+row.getAttribute('data-min'));
  }
  function endFillDrag() {
    document.removeEventListener('pointermove', onFillMove);
    document.removeEventListener('pointerup', endFillDrag);
    document.removeEventListener('pointercancel', endFillDrag);
    if (!fillDrag) return;
    var mins = fillDrag.mins || [];
    var slots = day(selectedDate).slots;
    var src = slots[fillDrag.sourceMin];
    fillDrag = null;
    if (mins.length && src && !src.del) {
      mins.forEach(function (m) {
        slots[m] = { name: src.name, done: false, group: src.group, cat: src.cat || null, ts: Date.now() };
      });
      save();
      toast('「' + src.name + '」 ' + mins.length + '칸 채움 (+' + fmtDur(mins.length * STEP) + ')');
    }
    renderAll();
  }
  function startFillDrag(min) {
    if (fillDrag || slotDrag) return;
    var s0 = day(selectedDate).slots[min];
    if (!s0 || s0.del) return;
    fillDrag = { sourceMin: min, mins: [] };
    document.addEventListener('pointermove', onFillMove);
    document.addEventListener('pointerup', endFillDrag);
    document.addEventListener('pointercancel', endFillDrag);
  }

  /* ── 렌더: 일정표 (15분 단위) ─────────── */
  var editorMin = null;
  function placeActivity(name, start, dur, selCat, forDate) {
    var slots = day(forDate || selectedDate).slots;
    if (!name) { toast('활동 이름을 입력해 주세요'); return false; }
    if (start + dur > SLOT_END) { toast('24:00을 넘길 수 없어요'); return false; }
    for (var m2 = start; m2 < start + dur; m2 += STEP) {
      if (slots[m2] && !slots[m2].del) { toast(minToHM(m2) + ' 칸이 이미 차 있어요'); return false; }
    }
    var cat = selCat && selCat !== 'etc' ? selCat : (selCat === 'etc' ? null : matchTodoCat(name));
    var g = uid();
    for (var m3 = start; m3 < start + dur; m3 += STEP) {
      slots[m3] = { name: name, done: false, group: g, cat: cat, ts: Date.now() };
    }
    save();
    return g;
  }
  function matchTodoCat(name) {
    var todos = day(selectedDate).todos;
    for (var i = 0; i < todos.length; i++) {
      if (!todos[i].del && todos[i].title === name) return todos[i].cat;
    }
    return null;
  }
  function fmtDur(min) {
    var h = Math.floor(min / 60), m = min % 60;
    return (h ? h + '시간' : '') + (h && m ? ' ' : '') + (m || !h ? m + '분' : '');
  }
  function balanceHTML(slots) {
    var counts = {};
    var total = 0;
    Object.keys(slots).forEach(function (k) {
      if (slots[k].del) return;
      var c = slots[k].cat && CATS[slots[k].cat] ? slots[k].cat : 'etc';
      counts[c] = (counts[c] || 0) + 1;
      total++;
    });
    if (!total) return '';
    var order = CAT_KEYS.concat(['etc']);
    var colorOf = function (c) { return c === 'etc' ? 'var(--c5)' : 'var(--' + c + ')'; };
    var nameOf = function (c) { return c === 'etc' ? '미분류' : CATS[c].name; };
    var bar = '', legend = '';
    order.forEach(function (c) {
      if (!counts[c]) return;
      var pct = counts[c] / total * 100;
      bar += '<span style="width:' + pct.toFixed(1) + '%;background:' + colorOf(c) + '"></span>';
      legend += '<span><i class="dot" style="background:' + colorOf(c) + '"></i>' +
        nameOf(c) + ' ' + fmtDur(counts[c] * STEP) + ' (' + Math.round(pct) + '%)</span>';
    });
    return '<div class="balance"><div class="balance-bar">' + bar + '</div>' +
      '<div class="balance-legend">' + legend + '</div></div>';
  }
  function renderSchedule() {
    var panel = document.getElementById('panel');
    var d = day(selectedDate);
    var slots = d.slots;
    var keys = Object.keys(slots).filter(function (k) { return !slots[k].del; });
    var doneN = keys.filter(function (k) { return slots[k].done; }).length;

    var durOpts = [15, 30, 45, 60, 90, 120].map(function (n) {
      return '<option value="' + n + '">' + n + '분</option>';
    }).join('');

    var dl = day(selectedDate).todos.filter(function (t) { return !t.done && !t.del; })
      .map(function (t) {
        return '<option value="' + t.title.replace(/"/g, '&quot;') + '" label="' +
          (CATS[t.cat] ? CATS[t.cat].name + ' · ' : '') + t.title.replace(/"/g, '&quot;') + '">';
      }).join('');

    var catOpts = '<option value="">카테고리 자동</option>' +
      CAT_KEYS.map(function (k) { return '<option value="' + k + '">' + CATS[k].name + '</option>'; }).join('') +
      '<option value="etc">미분류</option>';

    if (editorMin !== null && slots[editorMin] && !slots[editorMin].del) editorMin = null;

    panel.innerHTML =
      '<div class="sch-progress">15분 블록 ' + doneN + ' / ' + keys.length + ' 실천 · <b>시간 칸을 누르면 그 자리에서 바로 배치</b> · ✓ 누른 채 드래그=여러 칸 체크/해제 · ⇕ 드래그=같은 활동으로 칸 채우기</div>' +
      balanceHTML(slots) +
      '<div class="timeline" id="timeline"></div>';

    var tl = document.getElementById('timeline');
    for (var mm = SLOT_START; mm < SLOT_END; mm += STEP) {
      (function (mm) {
        var row = document.createElement('div');
        row.className = 'slot-row' + (mm % 60 === 0 ? ' hour-start' : '');
        row.setAttribute('data-min', mm);
        var timeCell = '<div class="slot-time">' + (mm % 60 === 0 ? minToHM(mm) : '') + '</div>';
        var s = slots[mm];
        if (s && !s.del) {
          row.innerHTML = timeCell +
            '<div class="slot-body"><div class="slot-block' + (s.done ? ' done-block' : '') +
            (s.cat && CATS[s.cat] ? ' cat-' + s.cat : '') + '">' +
            '<button class="chk' + (s.done ? ' on' : '') + '">' + (s.done ? '✓' : '') + '</button>' +
            '<span class="name' + (s.done ? ' done' : '') + '"></span>' +
            '<input class="note-input" maxlength="60" placeholder="세부 작업 메모">' +
            '<span class="fill-handle" title="드래그해서 같은 활동으로 칸 채우기">⇕</span>' +
            '<button class="icon-btn del" title="이 칸(15분)만 삭제">✕</button>' +
            '</div></div>';
          row.querySelector('.name').textContent = s.name;
          var noteInp = row.querySelector('.note-input');
          noteInp.value = s.note || '';
          noteInp.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') this.blur();
            e.stopPropagation();
          });
          noteInp.addEventListener('blur', function () {
            var v = this.value.trim();
            if ((s.note || '') === v) return;
            if (v) s.note = v; else delete s.note;
            s.ts = Date.now();
            save();
          });
          row.querySelector('.fill-handle').addEventListener('pointerdown', function (e) {
            e.preventDefault();
            startFillDrag(mm);
          });
          var chk = row.querySelector('.chk');
          chk.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            startSlotDrag(mm);
          });
          chk.addEventListener('click', function () {
            if (Date.now() - slotDragEndAt < 400) return;
            s.done = !s.done;
            s.ts = Date.now();
            addPoints(s.done ? POINT_SLOT : -POINT_SLOT, s.done ? '15분 실천!' : null);
            save(); renderAll();
          });
          row.querySelector('.del').addEventListener('click', function () {
            if (s.done) addPoints(-POINT_SLOT);
            slots[mm] = { del: Date.now(), ts: Date.now() };
            save(); renderAll();
            toast(minToHM(mm) + ' 칸의 「' + s.name + '」 삭제');
          });
        } else if (editorMin === mm) {
          row.innerHTML = timeCell +
            '<div class="slot-body"><div class="slot-editor">' +
            '<input id="seName" list="seDl" maxlength="60" placeholder="' + minToHM(mm) + ' 시작 — 활동 이름 (Enter=배치)">' +
            '<datalist id="seDl">' + dl + '</datalist>' +
            '<div class="se-row">' +
            '<select id="seCat" title="카테고리">' + catOpts + '</select>' +
            '<select id="seDur" title="소요 시간">' + durOpts + '</select>' +
            '<button id="seOk">배치</button>' +
            '<button class="se-cancel" id="seCancel" title="취소">✕</button>' +
            '</div></div></div>';
          var doPlace = function () {
            var nm = document.getElementById('seName').value.trim();
            var ok = placeActivity(nm, mm,
              +document.getElementById('seDur').value,
              document.getElementById('seCat').value);
            if (ok) { editorMin = null; renderAll(); }
          };
          row.querySelector('#seOk').addEventListener('click', doPlace);
          row.querySelector('#seCancel').addEventListener('click', function () {
            editorMin = null; renderAll();
          });
          row.querySelector('#seName').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') doPlace();
            if (e.key === 'Escape') { editorMin = null; renderAll(); }
            e.stopPropagation();
          });
          // 할 일과 이름이 같으면 그 카테고리를 화면에도 바로 보여준다
          // (지금까지도 배치 시 자동으로 적용은 됐지만, 선택창이 계속
          // "카테고리 자동"으로만 보여서 아무것도 안 정해진 것처럼 보였다)
          var catTouchedByUser = false;
          row.querySelector('#seCat').addEventListener('change', function () {
            catTouchedByUser = true;
          });
          row.querySelector('#seName').addEventListener('input', function () {
            if (catTouchedByUser) return;
            var catSel = document.getElementById('seCat');
            var matched = matchTodoCat(this.value.trim());
            if (catSel) catSel.value = matched && CATS[matched] ? matched : '';
          });
        } else {
          row.innerHTML = timeCell + '<div class="slot-body clickable"></div>';
          row.querySelector('.slot-body').addEventListener('click', function () {
            editorMin = mm;
            renderAll();
          });
        }
        tl.appendChild(row);
      })(mm);
    }

    var seInput = document.getElementById('seName');
    if (seInput) seInput.focus();
  }

  /* ── 수업 계획 (첨부파일은 기기 로컬 저장, 동기화 대상 아님) ── */
  var LEC_IMG_KEY = 'todoTracker.lecImages.v1';
  function loadLecImages() {
    try {
      var raw = localStorage.getItem(LEC_IMG_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {};
  }
  function saveLecImages() {
    try { localStorage.setItem(LEC_IMG_KEY, JSON.stringify(lecImages)); }
    catch (e) { toast('첨부파일 저장 공간이 부족해요. 오래된 계획의 첨부파일을 정리해 주세요.'); }
  }
  var lecImages = loadLecImages();
  function lecImgOf(planId, kind) {
    return (lecImages[planId] && lecImages[planId][kind]) || [];
  }
  function isImageAttachment(a) {
    return (a.mime || '').indexOf('image/') === 0 || (!a.mime && a.dataUrl.indexOf('data:image/') === 0);
  }
  function fileIconFor(name, mime) {
    var ext = (name || '').split('.').pop().toLowerCase();
    if (mime === 'application/pdf' || ext === 'pdf') return '📕';
    if (['doc', 'docx', 'hwp', 'hwpx'].indexOf(ext) > -1) return '📝';
    if (['ppt', 'pptx'].indexOf(ext) > -1) return '📊';
    if (['xls', 'xlsx', 'csv'].indexOf(ext) > -1) return '📈';
    return '📎';
  }
  var MAX_DOC_BYTES = 4 * 1024 * 1024; // 이미지가 아닌 파일은 리사이즈로 줄일 수 없어 크기를 제한
  function readAttachmentDataUrl(file) {
    var isImg = file.type.indexOf('image/') === 0;
    if (!isImg && file.size > MAX_DOC_BYTES) {
      return Promise.reject(new Error('"' + file.name + '" 파일이 너무 커요 (최대 4MB). 이미지는 자동으로 압축되지만 문서 파일은 원본 그대로 저장돼요.'));
    }
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function (e) {
        if (!isImg) { resolve(e.target.result); return; }
        var img = new Image();
        img.onload = function () {
          var maxDim = 800;
          var width = img.width, height = img.height;
          if (width > maxDim || height > maxDim) {
            if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
            else { width = Math.round(width * maxDim / height); height = maxDim; }
          }
          var canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  function openLightbox(src) {
    var ov = document.getElementById('lightboxOverlay');
    ov.innerHTML = '<img class="lightbox-img" src="' + src + '">';
    ov.classList.add('show');
  }
  document.getElementById('lightboxOverlay').addEventListener('click', function () {
    this.classList.remove('show'); this.innerHTML = '';
  });
  function downloadAttachment(a) {
    var link = document.createElement('a');
    link.href = a.dataUrl;
    link.download = a.name || '파일';
    document.body.appendChild(link);
    link.click();
    link.remove();
  }
  function renderThumbs(images) {
    if (!images || !images.length) return '';
    return '<div class="thumb-row">' + images.map(function (img, i) {
      return isImageAttachment(img)
        ? '<img class="thumb" data-i="' + i + '">'
        : '<div class="file-chip" data-i="' + i + '"><span class="file-chip-icon"></span><span class="file-chip-name"></span></div>';
    }).join('') + '</div>';
  }

  /* ── 기기 간 동기화 (로그인 불필요) ────── */
  // textdb.online: 키를 클라이언트가 정하는 key-value 저장소.
  // 키가 서버에 없어도 '빈 값'일 뿐이라 저장소 소실 개념이 없고, 다음 저장이 곧 복구다.
  var SYNC_READ = 'https://textdb.online/';
  var SYNC_WRITE = 'https://textdb.online/update';
  var SYNC_PAYLOAD_LIMIT = 150000; // textdb 안전 한도(실측 160KB OK, 200KB 실패)

  function encodeState(cb) {
    var json = JSON.stringify(state);
    if (typeof CompressionStream === 'undefined') { cb('RAW1:' + json); return; }
    try {
      var st = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
      new Response(st).arrayBuffer().then(function (buf) {
        var bytes = new Uint8Array(buf);
        var bin = '';
        for (var i = 0; i < bytes.length; i += 0x8000) {
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        }
        cb('GZ1:' + btoa(bin));
      }, function () { cb('RAW1:' + json); });
    } catch (e) { cb('RAW1:' + json); }
  }
  function decodePayload(text, cb) {
    if (!text) { cb(null); return; }
    if (text.slice(0, 5) === 'RAW1:') {
      try { cb(JSON.parse(text.slice(5))); } catch (e) { cb(null); }
      return;
    }
    if (text.slice(0, 4) === 'GZ1:' && typeof DecompressionStream !== 'undefined') {
      try {
        var bin = atob(text.slice(4));
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        new Response(st).text().then(function (json) {
          try { cb(JSON.parse(json)); } catch (e) { cb(null); }
        }, function () { cb(null); });
      } catch (e) { cb(null); }
      return;
    }
    try { cb(JSON.parse(text)); } catch (e) { cb(null); }
  }
  var SYNC_KEY = 'todoTracker.sync';
  var sync = (function () {

    return { id: null, lastSyncAt: null };

  var pushTimer = null;
  var lastActivityAt = Date.now();
  var lastPullAt = 0;

  function saveSync() { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); }
  function setSyncUrl() {
    try {
      if (!history.replaceState) return;

      else history.replaceState(null, '', location.pathname);

  }
  var goneNotified = false;
  var storeGone = false;
  function syncGone() {

      : (st === 'error' ? '동기화 오류 — 눌러서 확인' : '동기화 ' + (st === 'syncing' ? '중…' : '연결됨'));
  }
  function markSynced() { sync.lastSyncAt = Date.now(); storeGone = false; goneNotified = false; saveSync(); setSyncUI('ok'); }

  function schedulePush() {
    if (!sync.id) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushNow, 800);
  }
  var sizeWarnedAt = 0;
  function pushNow() {
    if (!sync.id) return Promise.resolve();
    setSyncUI('syncing');
    return new Promise(function (resolve) {
      encodeState(function (payload) {
        if (payload.length > SYNC_PAYLOAD_LIMIT && Date.now() - sizeWarnedAt > 60 * 60 * 1000) {
          sizeWarnedAt = Date.now();

        }

          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'key=' + encodeURIComponent(sync.id) + '&value=' + encodeURIComponent(payload)
        }).then(function (r) {

  function mergeItemArray(newerList, olderList, carryKeyFn) {

    (newerList || []).forEach(function (t) {

    (olderList || []).forEach(function (t) {
      var prev = byId[t.id];
      if (prev) {
        // 같은 항목이 양쪽에 있으면 더 최근에 수정(삭제 포함)한 쪽을 채택
        if ((t.ts || 0) > (prev.ts || 0)) byId[t.id] = t;
        return;
      }
      if (t.carried && !t.del && seenCarry[carryKeyFn(t)]) return;
      byId[t.id] = t; order.push(t.id);
      if (t.carried && !t.del) seenCarry[carryKeyFn(t)] = 1;
    });
    var out = [];
    order.forEach(function (id) {
      var t = byId[id];
      if (t.del && now - t.del > GC_MS) return; // 오래된 삭제 표식 정리
      out.push(t);
    });
    return out;
  }
  function mergeStates(local, remote) {
    var lU = (local.meta && local.meta.updatedAt) || 0;
    var rU = (remote.meta && remote.meta.updatedAt) || 0;
    var newer = rU >= lU ? remote : local;
    var older = rU >= lU ? local : remote;
    var out = { days: {}, meta: {} };
    var nowG = Date.now();
    var GCG = 14 * 24 * 60 * 60 * 1000;
    // 루틴 목록: 항목별 최신 수정(삭제 포함)이 이기는 합집합
    var rById = {}, rOrder = [];
    ((newer.routines) || []).forEach(function (r) { rById[r.id] = r; rOrder.push(r.id); });
    ((older.routines) || []).forEach(function (r) {
      var prev = rById[r.id];
      if (prev) { if ((r.ts || 0) > (prev.ts || 0)) rById[r.id] = r; return; }
      rById[r.id] = r; rOrder.push(r.id);
    });
    out.routines = [];
    rOrder.forEach(function (id) {
      var r = rById[id];
      if (r.del && nowG - r.del > GCG) return;
      out.routines.push(JSON.parse(JSON.stringify(r)));
    });
    var dates = {};
    Object.keys(local.days || {}).forEach(function (k) { dates[k] = 1; });
    Object.keys(remote.days || {}).forEach(function (k) { dates[k] = 1; });
    Object.keys(dates).sort().forEach(function (dk) {
      var a = (newer.days || {})[dk], b = (older.days || {})[dk];
      if (!a || !b) { out.days[dk] = JSON.parse(JSON.stringify(a || b)); return; }
      var now = Date.now();
      var GC_MS = 14 * 24 * 60 * 60 * 1000;
      var merged = {
        todos: mergeItemArray(a.todos, b.todos, function (t) { return t.cat + '|' + t.title + '|' + (t.from || ''); }),
        inbox: mergeItemArray(a.inbox, b.inbox, function (t) { return t.title + '|' + (t.from || ''); }),
        lecturePlans: mergeItemArray(a.lecturePlans, b.lecturePlans, function (t) { return (t.className || '') + '|' + (t.subject || '') + '|' + t.start; }),
        slots: {}
      };
      // 루틴 체크: 날짜×루틴 단위로 최신 체크가 이김
      var ca = a.rchecks || {}, cb = b.rchecks || {};
      merged.rchecks = {};
      var cKeys = {};
      Object.keys(ca).forEach(function (k) { cKeys[k] = 1; });
      Object.keys(cb).forEach(function (k) { cKeys[k] = 1; });
      Object.keys(cKeys).forEach(function (k) {
        var va = ca[k], vb = cb[k];
        merged.rchecks[k] = !va ? vb : (!vb ? va : (((vb.ts || 0) > (va.ts || 0)) ? vb : va));
      });
      var sa = a.slots || {}, sb = b.slots || {};
      var mins = {};
      Object.keys(sa).forEach(function (m) { mins[m] = 1; });
      Object.keys(sb).forEach(function (m) { mins[m] = 1; });
      Object.keys(mins).forEach(function (m) {
        var va = sa[m], vb = sb[m];
        var v = !va ? vb : (!vb ? va : (((vb.ts || 0) > (va.ts || 0)) ? vb : va));
        if (v.del && now - v.del > GC_MS) return;
        merged.slots[m] = v;
      });
      out.days[dk] = JSON.parse(JSON.stringify(merged));
    });
    out.meta.points = Math.max((local.meta && local.meta.points) || 0, (remote.meta && remote.meta.points) || 0);
    out.meta.updatedAt = Math.max(lU, rU);
    return out;
  }
  function adoptState(next) {
    state = next;
    if (!state.meta) state.meta = { points: 0 };
    if (!state.days) state.days = {};
    if (!state.routines) state.routines = [];
    migrateTodoStatus(state);
    saveLocal();
    carryOver();
    renderAll();
  }
  function pullNow(quiet) {
    if (!sync.id) return Promise.resolve();
    lastPullAt = Date.now();
    if (!quiet) setSyncUI('syncing');
    return fetch(SYNC_READ + encodeURIComponent(sync.id), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    }).then(function (text) {
      return new Promise(function (resolve) {
        decodePayload(text, function (remote) {
          if (remote && typeof remote === 'object' && remote.days) {
            var ae = document.activeElement;
            var typing = ae && ae.tagName === 'INPUT' && ae.type !== 'checkbox' &&
              ((typeof ae.value === 'string' && ae.value.trim().length > 0) ||
               (ae.closest && ae.closest('.slot-editor')));
            if (!typing) {
              var merged = mergeStates(state, remote);
              if (JSON.stringify(merged) !== JSON.stringify(state)) {
                adoptState(merged);
                lastActivityAt = Date.now();
              }
              if (JSON.stringify(merged) !== JSON.stringify(remote)) schedulePush();
            }
          } else if (text === '') {
            // 아직 아무 기기도 저장한 적 없는 키 → 이 기기의 데이터를 올린다
            schedulePush();
          }
          markSynced();
          resolve();
        });
      });
    }).catch(function () { setSyncUI('error'); });
  }
  function createRoom() {
    state.meta.updatedAt = Date.now();
    saveLocal();
    sync.id = (typeof crypto !== 'undefined' && crypto.randomUUID)
      ? crypto.randomUUID()
      : uid() + '-' + uid() + '-' + uid();
    saveSync();
    setSyncUrl();
    renderSyncModal();
    toast('동기화 코드가 만들어졌어요 ☁');
    return pushNow();
  }
  function connectRoom(id) {
    id = (id || '').trim().split('/').pop();
    if (!id) return Promise.resolve();
    setSyncUI('syncing');
    return fetch(SYNC_READ + encodeURIComponent(id), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    }).then(function (text) {
      return new Promise(function (resolve) {
        decodePayload(text, function (remote) {
          sync.id = id;
          if (remote && typeof remote === 'object' && remote.days) {
            adoptState(mergeStates(state, remote));
          }
          pushNow();
          setSyncUrl();
          renderSyncModal();
          toast('동기화가 연결됐어요 ☁ 두 기기의 데이터를 합쳤어요');
          resolve();
        });
      });
    }).catch(function () {
      setSyncUI('error');
      alert('동기화 서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.');
    });
  }
  function disconnectRoom() {
    if (!confirm('동기화 연결을 해제할까요?\n(이 기기의 데이터는 그대로 남고, 다른 기기와의 연동만 끊어져요)')) return;
    sync.id = null; sync.lastSyncAt = null;
    saveSync(); setSyncUrl(); setSyncUI('off'); renderSyncModal();
  }
  function copyText(text, label) {
    var done = function () { toast(label + ' 복사 완료!'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { prompt('직접 복사해 주세요:', text); });
    } else { prompt('직접 복사해 주세요:', text); }
  }
  function syncLink() {
    return location.origin + location.pathname + '?sync=' + encodeURIComponent(sync.id);
  }
  function fmtTime(ts) {
    if (!ts) return '-';
    var d = new Date(ts);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function renderSyncModal() {
    var body = document.getElementById('syncModalBody');
    if (!sync.id) {
      body.innerHTML =
        '<h2>☁ 기기 간 동기화</h2>' +
        '<p class="desc">로그인 없이 PC와 모바일에서 같은 데이터를 쓸 수 있어요.<br>' +
        '한 기기에서 <b>동기화 코드</b>를 만들고, 다른 기기에서 그 코드(또는 링크)로 연결하면 됩니다.<br>' +
        '⚠️ 코드를 아는 사람은 누구나 데이터를 보거나 수정할 수 있으니 비밀번호처럼 다뤄 주세요.</p>' +
        '<button class="btn" id="syncCreate">새 동기화 코드 만들기</button>' +
        '<input class="code-input" id="syncCodeInput" placeholder="다른 기기에서 만든 코드 붙여넣기">' +
        '<button class="btn secondary" id="syncConnect">코드로 연결하기</button>' +
        '<div class="close-row"><button id="syncClose">닫기</button></div>';
      document.getElementById('syncCreate').addEventListener('click', createRoom);
      document.getElementById('syncConnect').addEventListener('click', function () {
        connectRoom(document.getElementById('syncCodeInput').value);
      });
    } else {
      body.innerHTML =
        '<h2>☁ 동기화 연결됨</h2>' +
        (storeGone
          ? '<p class="desc" style="color:var(--sun)">⚠️ 서버에서 동기화 저장소가 사라졌어요(무료 저장소 정리 등).<br>' +
            '이 기기의 데이터는 안전합니다. 아래 <b>새 코드로 다시 만들기</b>를 누르면 지금 데이터로 새 저장소가 만들어져요.<br>' +
            '그 다음 새 연동 링크를 다른 기기에서 한 번만 열면 다시 합쳐집니다.</p>'
          : '') +
        '<p class="desc">아래 링크를 다른 기기(모바일 등)에서 열면 바로 연동됩니다.<br>' +
        '두 기기를 같이 켜두면 변경사항이 몇 초 안에 서로 반영돼요.<br>' +
        '메모장·메신저 "나에게 보내기"로 링크를 전달하면 편해요.</p>' +
        '<div class="code-box" id="syncLinkBox"></div>' +
        '<button class="btn" id="syncCopyLink">🔗 연동 링크 복사</button>' +
        '<button class="btn secondary" id="syncCopyCode">코드만 복사</button>' +
        '<button class="btn secondary" id="syncNow">지금 동기화</button>' +
        '<button class="btn secondary" id="syncRecreate">🔄 새 코드로 다시 만들기 (데이터 유지)</button>' +
        '<button class="btn danger" id="syncOff">연결 해제</button>' +
        '<div class="sync-meta">마지막 동기화: ' + fmtTime(sync.lastSyncAt) + '</div>' +
        '<div class="close-row"><button id="syncClose">닫기</button></div>';
      document.getElementById('syncLinkBox').textContent = syncLink();
      document.getElementById('syncCopyLink').addEventListener('click', function () { copyText(syncLink(), '연동 링크'); });
      document.getElementById('syncCopyCode').addEventListener('click', function () { copyText(sync.id, '코드'); });
      document.getElementById('syncNow').addEventListener('click', function () {
        pullNow().then(pushNow).then(renderSyncModal);
      });
      document.getElementById('syncRecreate').addEventListener('click', function () {
        if (!confirm('새 동기화 코드를 만들까요?\n이 기기의 데이터는 그대로 유지되고, 다른 기기는 새 링크로 다시 연결해야 해요.')) return;
        createRoom();
      });
      document.getElementById('syncOff').addEventListener('click', disconnectRoom);
    }
    document.getElementById('syncClose').addEventListener('click', closeSyncModal);
  }
  function openSyncModal() { renderSyncModal(); document.getElementById('syncModal').classList.add('show'); }
  function closeSyncModal() { document.getElementById('syncModal').classList.remove('show'); }

  document.getElementById('syncBtn').addEventListener('click', openSyncModal);
  document.getElementById('syncModal').addEventListener('click', function (e) {
    if (e.target === this) closeSyncModal();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { lastActivityAt = Date.now(); pullNow(); }
  });
  // 준실시간 폴링: 최근 3분 내 활동(내 저장 또는 상대 기기의 변경 수신)이 있으면
  // 4초마다, 그 외에는 30초마다 확인. 화면이 꺼져 있으면 쉬고, 입력 중이면 적용을 미룸.
  setInterval(function () {
    if (!sync.id || document.visibilityState !== 'visible') return;
    var fast = Date.now() - lastActivityAt < 3 * 60 * 1000;
    if (Date.now() - lastPullAt >= (fast ? 4000 : 30000)) pullNow(true);
  }, 2000);

  /* ── 시작 ─────────────────────────────── */
  // 하루 한 번 로컬 백업 스냅샷 (만일의 데이터 사고 대비)
  (function () {
    try {
      var K = 'todoTracker.bak';
      if (localStorage.getItem(K + '.date') !== todayKey) {
        var cur = localStorage.getItem(STORE_KEY);
        if (cur) {
          localStorage.setItem(K, cur);
          localStorage.setItem(K + '.date', todayKey);
        }
      }
    } catch (e) {}
  })();
  carryOver();
  renderAll();
  setSyncUI('ok');
  (function () {
    var m = location.search.match(/[?&]sync=([^&]+)/);
    var linkId = m ? decodeURIComponent(m[1]) : null;
    if (linkId && !sync.id) {
      // 저장소가 비워진 기기도 링크만 열면 자동 재연결되어 클라우드에서 복원
      connectRoom(linkId);
    } else if (linkId && sync.id && linkId !== sync.id) {
      if (confirm('이 링크의 동기화 코드가 현재 연결과 달라요.\n링크의 코드로 전환할까요? (기기의 데이터는 합쳐져요)')) {
        connectRoom(linkId);
      } else {
        setSyncUrl();
        pullNow();
      }
    } else {
      if (sync.id) pullNow();
      setSyncUrl();
    }
  })();
})();
</script>
</body>
